services:
  postgres:
    image: postgres:16-alpine
    container_name: mbg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbg_user
      POSTGRES_PASSWORD: mbg_password
      POSTGRES_DB: mbg_lms
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mbg-network

  redis:
    image: redis:7-alpine
    container_name: mbg-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - mbg-network

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: mbg-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - mbg-network

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: mbg-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mbg-network

  nginx:
    image: nginx:alpine
    container_name: mbg-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mbg-network

  prometheus:
    image: prom/prometheus:latest
    container_name: mbg-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - mbg-network

  grafana:
    image: grafana/grafana:latest
    container_name: mbg-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mbg-network

volumes:
  postgres_data:
  grafana_data:

networks:
  mbg-network:
    driver: bridge
